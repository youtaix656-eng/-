name: Deploy to GitHub Pages

# main ブランチへの push で自動ビルド＆デプロイする。
# 事前に GitHub リポジトリの Settings → Pages で
# 「Source: GitHub Actions」を選択しておく必要があります。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを1本に制限（進行中のものはキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build (鍼灸アプリ / ルート)
        run: npm run build

      # るるくる業務マニュアル（Next.js）を /rirakuru サブパスへ書き出し、
      # 同じ Pages 成果物に同梱する（既存アプリは維持したまま追加）。
      - name: Install dependencies (rurukuru)
        run: npm ci
        working-directory: rirakuru-app

      - name: Build (るるくる業務マニュアル / /rirakuru)
        run: npm run build
        working-directory: rirakuru-app
        env:
          NEXT_PUBLIC_BASE_PATH: /-/rirakuru

      # 分割睡眠トラッカー（Vite + React + TypeScript）を /sleep-tracker サブパスへビルドし、
      # 同じ Pages 成果物に同梱する（既存アプリは維持したまま追加）。
      - name: Install dependencies (sleep-tracker)
        run: npm ci
        working-directory: sleep-tracker

      - name: Build (睡眠トラッカー / /sleep-tracker)
        run: npm run build
        working-directory: sleep-tracker

      # 腰痛ナビ（Vite + React）を /youtsu-navi サブパスへビルドし、
      # 同じ Pages 成果物に同梱する（既存アプリは維持したまま追加）。
      - name: Install dependencies (腰痛ナビ)
        run: npm ci
        working-directory: youtsu-navi

      - name: Test (腰痛ナビ)
        run: npm test
        working-directory: youtsu-navi

      - name: Build (腰痛ナビ / /youtsu-navi)
        run: npm run build
        working-directory: youtsu-navi

      # 変革ノート（Vite + React + TypeScript / PWA）を /henkaku-note サブパスへビルドし、
      # 同じ Pages 成果物に同梱する（既存アプリは維持したまま追加）。
      - name: Install dependencies (変革ノート)
        run: npm ci
        working-directory: henkaku-note

      - name: Test (変革ノート)
        run: npm test
        working-directory: henkaku-note

      - name: Build (変革ノート / /henkaku-note)
        run: npm run build
        working-directory: henkaku-note

      # Ouro（自分専用のAI会社 / Vite + React JSX）を /ouro サブパスへビルドし、
      # 同じ Pages 成果物に同梱する（既存アプリは維持したまま追加）。
      - name: Install dependencies (Ouro)
        run: npm ci
        working-directory: ouro

      - name: Test (Ouro)
        run: npm test
        working-directory: ouro

      - name: Build (Ouro / /ouro)
        run: npm run build
        working-directory: ouro

      # 鏡（かがみ / Vite + React JSX）を /kagami サブパスへビルドし、
      # 同じ Pages 成果物に同梱する（既存アプリは維持したまま追加）。
      - name: Install dependencies (鏡)
        run: npm ci
        working-directory: kagami

      - name: Test (鏡)
        run: npm test
        working-directory: kagami

      - name: Build (鏡 / /kagami)
        run: npm run build
        working-directory: kagami

      # 資格ラボ（過去問→AI変換 / Vite + React JSX）を /shikaku-lab サブパスへビルドし、
      # 同じ Pages 成果物に同梱する（既存アプリは維持したまま追加）。
      - name: Install dependencies (資格ラボ)
        run: npm ci
        working-directory: shikaku-lab

      - name: Test (資格ラボ)
        run: npm test
        working-directory: shikaku-lab

      - name: Build (資格ラボ / /shikaku-lab)
        run: npm run build
        working-directory: shikaku-lab

      # 間合い（まあい / Vite + React JSX）を /maai サブパスへビルドし、
      # 同じ Pages 成果物に同梱する（既存アプリは維持したまま追加）。
      - name: Install dependencies (間合い)
        run: npm ci
        working-directory: maai

      - name: Test (間合い)
        run: npm test
        working-directory: maai

      - name: Build (間合い / /maai)
        run: npm run build
        working-directory: maai

      # 腸（ちょう / Vite + React JSX）を /chou サブパスへビルドし、
      # 同じ Pages 成果物に同梱する（既存アプリは維持したまま追加）。
      - name: Install dependencies (腸)
        run: npm ci
        working-directory: chou

      - name: Test (腸)
        run: npm test
        working-directory: chou

      - name: Build (腸 / /chou)
        run: npm run build
        working-directory: chou

      - name: Assemble Pages output
        run: |
          rm -rf dist/rirakuru dist/sleep-tracker dist/youtsu-navi dist/henkaku-note dist/ouro dist/kagami dist/shikaku-lab dist/maai dist/chou
          cp -r rirakuru-app/out dist/rirakuru
          cp -r sleep-tracker/dist dist/sleep-tracker
          cp -r youtsu-navi/dist dist/youtsu-navi
          cp -r henkaku-note/dist dist/henkaku-note
          cp -r ouro/dist dist/ouro
          cp -r kagami/dist dist/kagami
          cp -r shikaku-lab/dist dist/shikaku-lab
          cp -r maai/dist dist/maai
          cp -r chou/dist dist/chou
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
