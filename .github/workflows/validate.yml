name: Validate content & build

# デプロイ前の品質ゲート。PR と main への push で
#   1) テスト  2) コンテンツ検証（スキーマ・重複・版番号・網羅・数値鮮度）  3) ビルド
#   4) E2Eスモークテスト（主要画面が実際にブラウザで描画されコンソールエラーが無いか）
# を実行する。スキーマ/重複/版番号に重大エラーがあれば失敗する。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate content (schema / dedup / coverage / freshness)
        run: npm run validate

      - name: Lint theme (黒背景・白文字の不変条件)
        run: npm run lint:theme

      - name: Security audit (high 以上で警告)
        run: npm audit --audit-level=high || true

      - name: Build
        run: npm run build

      - name: Performance budget (bundle size)
        run: npm run check:size

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke test (主要画面がレンダリングされコンソールエラーが無いか)
        run: npm run e2e:smoke
